[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[server]
address = "127.0.0.1"
headless = true
fileWatcherType = "none"
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 1

[theme]
primaryColor = "#1d766d"
backgroundColor = "#f7f9fb"
secondaryBackgroundColor = "#e9eef3"
textColor = "#162b40"
