[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atalaya-lab"
version = "0.2.0"
description = "Local paper-trading research dashboard"
requires-python = ">=3.12"
dependencies = ["streamlit==1.64.0"]

[tool.setuptools.packages.find]
include = ["lab*"]
